<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 очко</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <h1 class="title">21 ОЧКО</h1>

        <div class="table">
            <div class="player">
                <p class="player-name" id="userName">USER</p>
                <div class="score" id="userScore">0</div>
                <div class="hand" id="userHand"></div>
            </div>

            <div class="middle">
                <div class="status" id="status">Натисніть, щоб почати</div>
                <div class="button button-hit" id="hitButton" onclick="hit();">ЩЕ</div>
                <div class="button button-stand" id="standButton" onclick="stand();">СТОП</div>
                <div class="button button-new" id="newButton" onclick="startGame();">ПОЧАТИ</div>
                <div class="final" id="final"></div>

                <div class="match">
                    Рахунок матчу<br>
                    <span id="matchScore">0 : 0</span>
                </div>
            </div>

            <div class="player">
                <p class="player-name">COMPUTER</p>
                <div class="score" id="computerScore">0</div>
                <div class="hand" id="computerHand"></div>
            </div>
        </div>

        <div class="rules">
            <p class="rules-title">ПРАВИЛА</p>
            <p class="rules-text">Набери суму, ближчу до 21, ніж у комп'ютера. Більше 21 — перебір і поразка. Комп'ютер добирає карти, поки має менше 17.</p>
            <p class="rules-cards">6–10 — за номіналом &nbsp;•&nbsp; В — 2 &nbsp;•&nbsp; Д — 3 &nbsp;•&nbsp; К — 4 &nbsp;•&nbsp; Т — 11</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
