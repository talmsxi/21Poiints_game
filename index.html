<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 7</title>
    <style>
        body {
            background-color: #0d0d18;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px;
        }
        input {
            width: 320px;
            height: 50px;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background-color: #26263a;
            border: 1px solid #44445e;
            border-radius: 25px;
            color: #ffffff;
            outline: none;
        }
        input::placeholder {
            color: #8888a0;
        }
        .btn {
            width: 320px;
            height: 50px;
            line-height: 50px;
            margin: 12px auto 0;
            text-align: center;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background-color: #3f55c8;
            border-radius: 25px;
            color: #ffffff;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #5068e0;
        }
        .error {
            height: 20px;
            margin: 12px 0 0;
            font-size: 14px;
            color: #ff7a9c;
        }
        .ball {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 30px auto 0;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #4a4a58, #000000 70%);
            perspective: 800px;
            cursor: grab;
        }
        .light {
            position: absolute;
            top: 40px;
            left: 55px;
            width: 55px;
            height: 35px;
            border-radius: 50%;
            background-color: #ffffff;
            opacity: 0.25;
        }
        .rotator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }
        .face {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 130px;
            height: 130px;
            margin: -65px 0 0 -65px;
            border-radius: 50%;
            backface-visibility: hidden;
        }
        .eight {
            background-color: #ffffff;
            color: #000000;
            font-size: 70px;
            line-height: 130px;
            text-align: center;
            transform: translateZ(125px);
        }
        .window {
            background-color: #0a0f2a;
            overflow: hidden;
            transform: rotateY(180deg) translateZ(125px);
        }
        .triangle {
            position: absolute;
            top: 25px;
            left: 20px;
            width: 0;
            height: 0;
            border-left: 45px solid transparent;
            border-right: 45px solid transparent;
            border-bottom: 80px solid #2a46b0;
        }
        .answer {
            position: absolute;
            top: 65px;
            left: 25px;
            width: 80px;
            font-size: 11px;
            text-align: center;
            color: #ffffff;
        }
        .hint {
            margin: 25px 0 0;
            font-size: 13px;
            color: #7a7a90;
        }
        @media (max-width: 400px) {
            input, .btn {
                width: 100%;
            }
            .ball {
                width: 220px;
                height: 220px;
            }
            .eight {
                transform: translateZ(95px);
            }
            .window {
                transform: rotateY(180deg) translateZ(95px);
            }
        }
    </style>
    <script>
        const answers = ['ЦЕ ТОЧНО', 'БЕЗ СУМНІВУ', 'ТАК, ВИЗНАЧЕНО',
                         'МОЖЕШ ПОКЛАСТИСЬ', 'СКОРІШЕ ЗА ВСЕ', 'ПЕРСПЕКТИВИ ДОБРІ',
                         'ВІДПОВІДЬ ТУМАННА', 'ЗАПИТАЙ ПІЗНІШЕ', 'ЗАРАЗ НЕ ВГАДАТИ',
                         'НЕ РОЗРАХОВУЙ НА ЦЕ', 'МОЯ ВІДПОВІДЬ - НІ', 'ДУЖЕ СУМНІВНО'];

        let isDown = false;
        let startX = 0;
        let angle = 0;

        window.onload = createPage;

        function createPage() {
            let question = document.createElement('input');
            question.setAttribute('type', 'text');
            question.setAttribute('id', 'question');
            question.setAttribute('placeholder', 'Постав своє запитання');
            document.body.appendChild(question);

            let btn = document.createElement('div');
            btn.classList.add('btn');
            btn.innerHTML = 'Запитати';
            btn.onclick = ask;
            document.body.appendChild(btn);

            let error = document.createElement('p');
            error.classList.add('error');
            error.setAttribute('id', 'error');
            document.body.appendChild(error);

            let ball = document.createElement('div');
            ball.classList.add('ball');

            let rotator = document.createElement('div');
            rotator.classList.add('rotator');
            rotator.setAttribute('id', 'rotator');

            let eight = document.createElement('div');
            eight.classList.add('face');
            eight.classList.add('eight');
            eight.innerHTML = '8';
            rotator.appendChild(eight);

            let box = document.createElement('div');
            box.classList.add('face');
            box.classList.add('window');

            let triangle = document.createElement('div');
            triangle.classList.add('triangle');
            box.appendChild(triangle);

            let answer = document.createElement('div');
            answer.classList.add('answer');
            answer.setAttribute('id', 'answer');
            box.appendChild(answer);

            rotator.appendChild(box);
            ball.appendChild(rotator);

            let light = document.createElement('div');
            light.classList.add('light');
            ball.appendChild(light);

            ball.onmousedown = startDrag;
            ball.onwheel = wheel;
            document.onmousemove = drag;
            document.onmouseup = stopDrag;

            document.body.appendChild(ball);

            let hint = document.createElement('p');
            hint.classList.add('hint');
            hint.innerHTML = 'Тягни кулю мишкою або крути колесиком';
            document.body.appendChild(hint);
        }

        function startDrag(e) {
            isDown = true;
            startX = e.clientX;
            document.getElementById('rotator').style.transition = 'none';
        }

        function drag(e) {
            if (isDown) {
                angle = angle + (e.clientX - startX);
                startX = e.clientX;
                showBall();
            }
        }

        function stopDrag() {
            isDown = false;
        }

        function wheel(e) {
            document.getElementById('rotator').style.transition = 'none';
            angle = angle + e.deltaY / 4;
            showBall();
        }

        function showBall() {
            document.getElementById('rotator').style.transform = 'rotateY(' + angle + 'deg)';
        }

        function ask() {
            let text = document.getElementById('question').value;

            if (text.trim() == '') {
                document.getElementById('error').innerHTML = 'Спочатку введіть запитання!';
            }
            else if (text.length < 5) {
                document.getElementById('error').innerHTML = 'Запитання занадто коротке!';
            }
            else {
                document.getElementById('error').innerHTML = '';

                let i = Math.floor(Math.random() * answers.length);
                document.getElementById('answer').innerHTML = answers[i];

                angle = angle + 720;
                angle = angle - (angle % 360) + 180;

                document.getElementById('rotator').style.transition = 'transform 1.5s';
                showBall();
            }
        }
    </script>
</head>
<body>
</body>
</html>
